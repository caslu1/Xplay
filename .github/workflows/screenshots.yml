name: Screenshots

on:
  workflow_dispatch:
    inputs:
      app:
        description: "App to capture: tv (Xplay) or mobile (Xplay Mobile)"
        required: false
        default: tv

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt apksigner zipalign dalvik-exchange ffmpeg python3-pil

      - name: Build APK
        run: |
          if [ "${{ inputs.app }}" = "mobile" ]; then ./mobile/build.sh; else ./build.sh; fi

      - name: Start mock Xtream server
        run: |
          mkdir -p media
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440 -t 40 \
            -c:v libx264 -preset veryfast -profile:v baseline -pix_fmt yuv420p -c:a aac \
            -f hls -hls_time 4 -hls_list_size 0 -hls_segment_filename media/live%d.ts media/live.m3u8
          ffmpeg -loglevel error -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=330 -t 30 \
            -c:v libx264 -preset veryfast -profile:v baseline -pix_fmt yuv420p -c:a aac -movflags +faststart media/movie.mp4
          nohup python3 tools/screenshots/mock_server.py 8000 media > mock.log 2>&1 &
          sleep 2
          curl -sf "http://127.0.0.1:8000/player_api.php?username=demo&password=demo"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: if [ "${{ inputs.app }}" = "mobile" ]; then bash mobile/tools/capture.sh; else bash tools/screenshots/capture.sh; fi

      - name: Publish to the screenshots branch
        if: always()
        run: |
          [ -d shots ] || exit 0
          cp mock.log shots/ 2>/dev/null || true
          BRANCH=screenshots
          [ "${{ inputs.app }}" = "mobile" ] && BRANCH=screenshots-mobile
          cd shots
          git init -q -b "$BRANCH"
          git add .
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
