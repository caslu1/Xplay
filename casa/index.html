<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Minha Casa</title>
<script src="three.min.js"></script>
<script src="casa3d.js"></script>
<style>
  :root {
    --bg1:#1b1f4a; --bg2:#2a2350; --bg3:#4b3a7a;
    --card:rgba(255,255,255,.075); --card-on:#121216; --box:#1e1e24; --box-on:#2b2b33;
    --text:#fff; --dim:rgba(255,255,255,.55); --dim2:rgba(255,255,255,.38);
    --accent:#7fb6ff; --green:#5fd38d; --red:#ff6b6b; --orange:#ff8a3d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; min-height:100%; }
  body {
    background:#1b1f4a linear-gradient(170deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%) fixed;
    color:var(--text); font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding-bottom:120px; user-select:none;
  }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; padding:0; }
  svg { display:block; }

  header { display:flex; align-items:center; gap:8px; padding:calc(18px + env(safe-area-inset-top)) 16px 8px 20px; }
  .home-btn { display:flex; align-items:center; gap:12px; font-size:26px; font-weight:700; }
  .home-btn .caret { width:0; height:0; border:7px solid transparent; border-top:9px solid #fff; margin-top:8px; }
  .spacer { flex:1; }
  .icon-btn { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; }
  .icon-btn:active { background:rgba(255,255,255,.1); }

  .tabs { display:flex; align-items:center; gap:22px; padding:10px 20px 6px; overflow-x:auto; scrollbar-width:none; white-space:nowrap; }
  .tabs::-webkit-scrollbar { display:none; }
  .tabs button { font-size:19px; color:var(--dim); font-weight:500; padding:6px 0; }
  .tabs button.on { color:#fff; font-weight:600; }
  .search { display:none; margin:6px 16px 0; }
  .search.show { display:block; }
  .search input { width:100%; padding:12px 16px; border-radius:16px; border:0; background:rgba(255,255,255,.1); color:#fff; font:inherit; outline:none; }

  main { padding:0 14px; max-width:720px; margin:0 auto; }
  .section-h { display:flex; align-items:center; justify-content:space-between; padding:22px 6px 10px; color:var(--dim); font-weight:600; font-size:17px; text-transform:uppercase; letter-spacing:.2px; }
  .section-h .chev { transition:transform .2s; }
  .section-h.closed .chev { transform:rotate(180deg); }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .grid.hidden { display:none; }

  .card { position:relative; display:flex; align-items:center; gap:8px; min-height:96px; padding:14px 12px 14px 18px; border-radius:30px; background:var(--card); text-align:left; transition:background .2s, transform .1s; }
  .card:active { transform:scale(.98); }
  .card .txt { flex:1; min-width:0; }
  .card .name { font-weight:600; font-size:15.5px; color:var(--dim); overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; word-break:break-word; }
  .card .state { color:var(--dim2); font-size:14.5px; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .box svg { transform:scale(.9); }
  .card .box { width:58px; height:58px; flex:none; border-radius:18px; display:grid; place-items:center; background:var(--box); }
  .card.on { background:var(--card-on); }
  .card.on .name { color:#fff; }
  .card.on .state { color:var(--dim); }
  .card.on .box { background:var(--box-on); box-shadow:inset 0 0 0 1px rgba(255,255,255,.04); }
  .card.on[data-type="ac"] .box { background:radial-gradient(circle at 50% 60%, rgba(94,200,255,.22), var(--box-on) 70%); }
  .card.on[data-type="light"] .box { background:radial-gradient(circle at 50% 50%, rgba(255,211,107,.28), var(--box-on) 70%); }
  .card.on[data-type="tv"] .box { background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.14), var(--box-on) 70%); }
  .card { box-shadow:0 1px 0 rgba(255,255,255,.04) inset; }
  .card.on { box-shadow:0 10px 24px -12px rgba(0,0,0,.6); }
  .card .box svg { transition:transform .25s cubic-bezier(.3,1.6,.5,1); }
  .card .box:active svg { transform:scale(.75); }
  .card.offline { opacity:.55; }
  .card.offline .box { background:transparent; }
  .badge { position:absolute; top:-8px; right:-6px; width:36px; height:36px; border-radius:50%; background:#2c2c34; display:grid; place-items:center; }
  .empty { color:var(--dim); text-align:center; padding:60px 20px; }
  .empty b { color:#fff; display:block; font-size:18px; margin-bottom:6px; }

  nav.bottom { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom)); width:min(640px, calc(100% - 24px)); display:flex; justify-content:space-around; padding:8px; background:rgba(28,28,32,.96); border-radius:40px; box-shadow:0 8px 30px rgba(0,0,0,.4); z-index:20; }
  nav.bottom { -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); background:rgba(24,24,30,.88); }
  nav.bottom button { transition:background .25s, color .25s; }
  nav.bottom button { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:13px; padding:8px 4px; border-radius:30px; color:#ddd; }
  nav.bottom button.on { background:rgba(255,255,255,.12); color:#fff; font-weight:600; }

  /* Bottom sheet */
  .scrim { position:fixed; inset:0; background:rgba(8,8,20,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); opacity:0; pointer-events:none; transition:opacity .2s; z-index:30; }
  .scrim.show { opacity:1; pointer-events:auto; }
  .sheet { position:fixed; left:50%; bottom:0; transform:translate(-50%,100%); width:min(720px,100%); max-height:92vh; overflow-y:auto; background:linear-gradient(180deg,#1d1d27 0%,#15151b 60%); border-radius:30px 30px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.45); padding:10px 20px calc(28px + env(safe-area-inset-bottom)); transition:transform .32s cubic-bezier(.2,.9,.25,1); overscroll-behavior:contain; z-index:31; }
  .sheet.show { transform:translate(-50%,0); }
  .grab { width:40px; height:5px; border-radius:3px; background:#444; margin:0 auto 14px; }
  .sheet h2 { margin:0; font-size:22px; } .sheet .sub { color:var(--dim); margin:2px 0 18px; }
  .row { display:flex; align-items:center; gap:12px; }
  .power { width:64px; height:64px; border-radius:50%; background:#2a2a32; display:grid; place-items:center; flex:none; }
  .power { transition:background .25s, box-shadow .25s, transform .15s; }
  .power:active { transform:scale(.92); }
  .power.on { background:linear-gradient(135deg,#7fd0ff,#7f8cff); color:#0c1a33; box-shadow:0 8px 24px -6px rgba(127,160,255,.7); }
  .power.on.heat { background:linear-gradient(135deg,#ffc06b,#ff6a5e); box-shadow:0 8px 24px -6px rgba(255,120,90,.7); }
  .dial-wrap { position:relative; width:270px; height:250px; margin:8px auto 0; touch-action:none; }
  .dial-wrap > svg { position:absolute; inset:0; width:270px; height:270px; }
  .dial-c { position:absolute; left:0; right:0; top:68px; text-align:center; pointer-events:none; }
  .dial-c .v { font-size:68px; font-weight:250; letter-spacing:-3px; line-height:1; }
  .dial-c .v sup { font-size:28px; letter-spacing:0; vertical-align:top; position:relative; top:6px; margin-left:2px; }
  .dial-c .l { color:var(--dim); font-size:14px; margin-top:8px; }
  .dial-c .m { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:5px 12px; border-radius:20px; background:rgba(255,255,255,.07); font-size:13.5px; color:#cfd6ff; }
  .dial-btns { display:flex; justify-content:space-between; width:270px; margin:-58px auto 10px; position:relative; }
  .modes { display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:8px; }
  .mode { display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 6px; border-radius:18px; background:#23232c; font-size:13px; color:#ccc; transition:background .2s, color .2s; }
  .mode svg { width:24px; height:24px; }
  .mode.on { background:linear-gradient(135deg,rgba(127,208,255,.22),rgba(127,140,255,.22)); color:#fff; box-shadow:inset 0 0 0 1.5px rgba(140,180,255,.6); }
  .mode.on.heat { background:linear-gradient(135deg,rgba(255,192,107,.2),rgba(255,106,94,.2)); box-shadow:inset 0 0 0 1.5px rgba(255,150,100,.6); }
  .seg { display:flex; background:#23232c; border-radius:18px; padding:4px; }
  .seg button { flex:1; padding:10px 0; border-radius:14px; font-size:14px; color:#bbb; transition:background .2s,color .2s; }
  .seg button.on { background:#3a3a48; color:#fff; font-weight:600; }
  .demo-pill { display:flex; align-items:center; gap:10px; margin:14px 4px 0; padding:12px 14px; border-radius:20px; background:linear-gradient(90deg,rgba(127,182,255,.16),rgba(160,120,255,.16)); font-size:14px; color:#dfe4ff; }
  .demo-pill b { flex:1; font-weight:500; }
  .demo-pill button { padding:8px 14px; border-radius:14px; background:#fff; color:#1b1f4a; font-weight:700; font-size:13.5px; }
  .stat { position:relative; overflow:hidden; }
  .stat::after { content:''; position:absolute; right:-20px; top:-20px; width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.05); }
  /* Lâmpadas */
  .slider { -webkit-appearance:none; appearance:none; width:100%; height:54px; border-radius:20px; outline:none; margin:0;
    background:linear-gradient(90deg, var(--lc,#ffd36b) 0 var(--p,50%), #26262e var(--p,50%) 100%); }
  .slider::-webkit-slider-thumb { -webkit-appearance:none; width:8px; height:34px; border-radius:4px; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); }
  .slider::-moz-range-thumb { width:8px; height:34px; border-radius:4px; background:#fff; border:0; }
  .swatches { display:flex; flex-wrap:wrap; gap:12px; }
  .sw { width:44px; height:44px; border-radius:50%; box-shadow:inset 0 0 0 2px rgba(255,255,255,.15); transition:transform .15s; }
  .sw.on { box-shadow:0 0 0 3px #17171c, 0 0 0 5px #fff; }
  .sw:active { transform:scale(.88); }
  .bulb-hero { display:grid; place-items:center; margin:18px 0 6px; }
  .bulb-hero .b { width:120px; height:120px; border-radius:50%; display:grid; place-items:center; transition:background .3s, box-shadow .3s; }

  /* Mapa 3D */
  .map-bar { display:flex; align-items:center; gap:10px; margin:14px 4px 10px; }
  .map-bar .seg { flex:0 0 auto; }
  .map-bar .seg button { padding:8px 16px; }
  .map-bar .tool { padding:10px 16px; border-radius:16px; background:rgba(255,255,255,.1); font-size:14px; font-weight:600; }
  .map-bar .tool.primary { background:#fff; color:#1b1f4a; }
  .stage { position:relative; border-radius:28px; overflow:hidden; touch-action:none; perspective:1400px;
    background:radial-gradient(ellipse at 50% 40%, rgba(255,255,255,.08), rgba(0,0,0,.18)); }
  .plane { position:absolute; left:50%; top:50%; transform-style:preserve-3d; transition:transform .45s cubic-bezier(.2,.9,.25,1);
    transform:translate(-50%,-50%) rotateX(var(--tilt)) rotateZ(var(--rot)) scale(var(--zoom)); }
  .stage.drag .plane { transition:none; }
  .base { position:absolute; inset:-14px; border-radius:18px; background:rgba(255,255,255,.06); box-shadow:0 30px 60px rgba(0,0,0,.35); }
  .room { position:absolute; transform-style:preserve-3d; }
  .room .floor { position:absolute; inset:0; background:var(--c); border-radius:3px; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.08); }
  .room .floor::after { content:''; position:absolute; inset:0; background:repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 18px); }
  .wall { position:absolute; background:linear-gradient(0deg, rgba(255,255,255,.92), rgba(240,240,250,.75)); box-shadow:inset 0 0 0 1px rgba(0,0,0,.06); backface-visibility:visible; }
  .wt, .wb { left:0; width:100%; height:var(--wh); transform-origin:top; transform:rotateX(90deg); }
  .wt { top:0; } .wb { top:100%; }
  .wl, .wr { top:0; height:100%; width:var(--wh); transform-origin:left; transform:rotateY(-90deg); }
  .wl { left:0; } .wr { left:100%; }
  .flat .wall { display:none; }
  .rlabel { position:absolute; left:8px; top:6px; font-size:12px; font-weight:700; color:rgba(20,20,40,.6); text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; pointer-events:none; }
  .edit .room .floor { box-shadow:inset 0 0 0 2px rgba(80,90,255,.55); }
  .rs { position:absolute; right:-10px; bottom:-10px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4); display:grid; place-items:center; color:#1b1f4a; font-size:13px; font-weight:800; }
  .pin { position:absolute; width:0; height:0; transform-style:preserve-3d; }
  .pin .glow { position:absolute; width:150px; height:150px; left:-75px; top:-75px; border-radius:50%; background:radial-gradient(circle, var(--g) 0%, transparent 65%); pointer-events:none; opacity:.85; }
  .pin .dot { position:absolute; width:14px; height:14px; left:-7px; top:-7px; border-radius:50%; background:rgba(0,0,0,.25); }
  .pin .stand { position:absolute; left:0; top:0; transform-style:preserve-3d;
    transform:translateZ(2px) rotateZ(calc(var(--rot) * -1)) rotateX(calc(var(--tilt) * -1)) scale(calc(1 / var(--zoom))); }
  .flat .pin .stand, .edit .pin .stand { transform:none; }
  .pin .card3 { position:absolute; left:0; bottom:0; transform:translate(-50%,-6px); display:flex; flex-direction:column; align-items:center; gap:3px; }
  .pin .bub { width:34px; height:34px; border-radius:50%; background:#1d1d24; display:grid; place-items:center; box-shadow:0 6px 14px rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.15); transition:background .25s, box-shadow .25s; }
  .pin .bub svg { width:20px; height:20px; }
  .pin.on .bub { background:#fff; border-color:#fff; box-shadow:0 0 0 3px var(--g), 0 8px 18px rgba(0,0,0,.4); }
  .pin.offline .bub { opacity:.5; }
  .pin .pn { display:none; }
  .labels .pin .pn, .pin.on .pn { display:block; }
  .flat .pin .pn { max-width:70px; }
  .pin .pn { font-size:10px; font-weight:700; color:#fff; background:rgba(15,15,25,.72); padding:2px 7px; border-radius:8px; white-space:nowrap; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
  .flat .pin .card3, .edit .pin .card3 { transform:translate(-50%,50%); }
  .stage3 { position:relative; height:calc(100vh - 300px); min-height:360px; border-radius:28px; overflow:hidden;
    background:radial-gradient(ellipse at 50% 35%, rgba(255,255,255,.10), rgba(0,0,0,.22)); }
  .c3d { position:absolute; inset:0; }
  .c3d canvas { display:block; touch-action:none; }
  .c3d-labels { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .lbl { position:absolute; left:0; top:0; width:0; height:0; pointer-events:none; }
  .lbl .bub { position:absolute; left:-17px; top:-38px; width:34px; height:34px; border-radius:50%; background:#1d1d24; display:grid; place-items:center; pointer-events:auto; cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.18); transition:background .25s, box-shadow .25s; }
  .lbl .bub svg { width:20px; height:20px; }
  .lbl.on .bub { background:#fff; border-color:#fff; box-shadow:0 0 0 3px var(--g), 0 0 22px var(--g); }
  .lbl.offline .bub { opacity:.5; }
  .lbl .pn { position:absolute; left:0; top:0; transform:translateX(-50%); font-size:10.5px; font-weight:700; color:#fff; background:rgba(15,15,25,.72); padding:2px 7px; border-radius:8px; white-space:nowrap; display:none; pointer-events:none; }
  .lbl.named .pn, .lbl.on .pn { display:block; }
  .map-bar .tool.cam { background:linear-gradient(135deg,#8fd6ff,#8a8dff); color:#0c1a33; }
  .furn { position:absolute; border-radius:4px; background:var(--fc); opacity:.92; box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18); display:grid; place-items:center; overflow:hidden; }
  .furn span { font-size:9px; font-weight:700; color:rgba(0,0,0,.6); white-space:nowrap; pointer-events:none; }
  .furn.wallish { background:repeating-linear-gradient(45deg, var(--fc) 0 4px, rgba(255,255,255,.6) 4px 8px); }
  .furn.sel { box-shadow:0 0 0 3px #6c7bff, 0 4px 12px rgba(0,0,0,.4); z-index:3; }
  .furn-tools { display:flex; gap:8px; justify-content:center; margin-top:10px; }
  .furn-tools .tool { padding:10px 16px; border-radius:16px; background:rgba(255,255,255,.12); font-weight:600; font-size:14px; }
  .catalog { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .catalog button { padding:12px 6px; border-radius:16px; background:#23232c; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .catalog i { width:30px; height:18px; border-radius:4px; display:block; }
  .photos { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .ph { position:relative; aspect-ratio:3/4; border-radius:14px; overflow:hidden; background:#23232c; display:grid; place-items:center; color:var(--dim); font-size:28px; }
  .ph img { width:100%; height:100%; object-fit:cover; }
  .ph button { position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%; background:rgba(0,0,0,.65); color:#fff; font-size:14px; }
  .scan-steps { color:var(--dim); font-size:14px; margin:4px 0 0; padding-left:18px; }
  .scan-steps li { margin:4px 0; }
  .busy { display:flex; align-items:center; gap:12px; margin-top:16px; padding:14px; border-radius:16px; background:rgba(127,182,255,.12); }
  .busy .ring { width:26px; height:26px; border-radius:50%; border:3px solid rgba(255,255,255,.2); border-top-color:#8fd6ff; animation:spin 1s linear infinite; flex:none; }
  .found { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .found span { padding:6px 10px; border-radius:12px; background:#23232c; font-size:13px; }
  .check { display:flex; gap:10px; align-items:center; margin-top:14px; color:#ddd; font-size:14px; }
  .check input { width:20px; height:20px; accent-color:#8fb4ff; }
  .err { color:var(--red); font-size:14px; margin-top:10px; }
  .map-hint { color:var(--dim); font-size:13px; text-align:center; margin:10px 0 0; }
  .legend { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:10px; font-size:13px; color:var(--dim); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  main.enter > * { animation:up .35s ease both; }
  @keyframes up { from { opacity:0; transform:translateY(10px); } }
  .big-temp { text-align:center; margin:22px 0 8px; }
  .big-temp .v { font-size:72px; font-weight:300; letter-spacing:-2px; }
  .big-temp .l { color:var(--dim); }
  .stepper { display:flex; justify-content:center; gap:28px; margin-bottom:18px; }
  .round { width:64px; height:64px; border-radius:50%; background:#26262e; font-size:30px; display:grid; place-items:center; }
  .round:active, .chip:active, .btn:active { filter:brightness(1.3); }
  .label { color:var(--dim); font-size:14px; margin:18px 0 8px; text-transform:uppercase; letter-spacing:.4px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:10px 16px; border-radius:20px; background:#26262e; font-size:15px; }
  .chip.on { background:linear-gradient(135deg,#7fd0ff,#7f8cff); color:#0c1a33; font-weight:600; }
  .chip { transition:background .2s; }
  .remote { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-top:8px; }
  .remote .col { display:flex; flex-direction:column; align-items:center; gap:10px; background:#202027; border-radius:40px; padding:10px 0; }
  .remote .col span { color:var(--dim); font-size:13px; }
  .disabled { opacity:.35; pointer-events:none; }

  .btn { display:block; width:100%; padding:15px; border-radius:18px; background:linear-gradient(135deg,#8fd6ff,#8a8dff); color:#0c1a33; font-weight:700; text-align:center; margin-top:12px; }
  .btn.ghost { background:#26262e; color:#fff; font-weight:600; }
  .btn.danger { background:#3a1f24; color:var(--red); }
  .field { display:block; margin-top:12px; }
  .field span { display:block; color:var(--dim); font-size:14px; margin-bottom:6px; }
  .field input, .field select { width:100%; padding:13px 14px; border-radius:14px; border:1px solid #33333d; background:#1f1f26; color:#fff; font:inherit; outline:none; }
  .panel { background:var(--card); border-radius:24px; padding:18px; margin-top:14px; }
  .panel h3 { margin:0 0 6px; font-size:18px; }
  .panel p { margin:6px 0; color:var(--dim); font-size:15px; }
  .panel a { color:var(--accent); }
  .list-item { display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid rgba(255,255,255,.07); }
  .list-item:first-of-type { border-top:0; }
  .list-item .t { flex:1; }

const S = {

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
const fmtT = v => v == null || isNaN(v) ? '--' : (Math.round(v * 10) / 10).toString().replace('.', ',');

function stateText(d) {
  if (!d.online) return 'Offline';
  if (d.type === 'ac') return d.on ? `Atual ${fmtT(d.temp)}°C` : 'Desligado';
  if (d.type === 'tv') return d.on ? 'Ligada' : 'Desativado';

  if (d.hasSwitch) return d.on ? 'Ligado' : 'Desligado';

}

/* ---------- Ponte com o app Android ---------- */
const NATIVE = window.Native || null;
const nativeCbs = {}; let nativeSeq = 0;
window.__nativeCb = (id, status, body) => { const cb = nativeCbs[id]; delete nativeCbs[id]; if (cb) cb(status, body); };
function nativeFetch(url, opts) {

/* ---------- SmartThings API ---------- */
const API = 'https://api.smartthings.com/v1';
async function api(path, opts = {}) {

  const r = NATIVE ? await nativeFetch(url, opts)
    : await fetch(url, { ...opts, headers: { 'Authorization': 'Bearer ' + S.token, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 0) throw new Error('Failed to fetch');
  if (r.status === 401) throw new Error('Token inválido ou expirado. Gere outro em Menu → Conexão.');
  if (r.status === 403) throw new Error('O token não tem permissão para isso. Marque todas as permissões de Devices, Locations e Scenes.');
  if (!r.ok) throw new Error('SmartThings respondeu ' + r.status);
  return r.status === 204 ? {} : r.json();
}
async function apiAll(path) {

  while (next) { const j = await api(next); out = out.concat(j.items || []); next = j._links && j._links.next && j._links.next.href; }
  return out;
}

function baseDevice(raw) {
  const caps = new Set();
  (raw.components || []).forEach(c => (c.capabilities || []).forEach(x => caps.add(x.id)));
  const cats = (raw.components || []).flatMap(c => (c.categories || []).map(x => x.name));
  let type = 'other';
  if (caps.has('airConditionerMode') || cats.includes('AirConditioner')) type = 'ac';
  else if (caps.has('tvChannel') || cats.includes('Television')) type = 'tv';
  else if (caps.has('switchLevel') || caps.has('colorControl') || cats.some(c => /Light/i.test(c))) type = 'light';
  else if (caps.has('audioVolume') || cats.includes('Speaker')) type = 'speaker';
  else if (caps.has('switch')) type = 'switch';
  return { id: raw.deviceId, name: raw.label || raw.name || 'Aparelho', roomId: raw.roomId || '', type, caps, hasSwitch: caps.has('switch'), online: true, on: false };
}
function applyStatus(d, st) {
  const m = (st.components && st.components.main) || {};
  const v = (cap, attr) => m[cap] && m[cap][attr] ? m[cap][attr].value : undefined;
  d.on = v('switch', 'switch') === 'on';
  d.temp = v('temperatureMeasurement', 'temperature');
  d.target = v('thermostatCoolingSetpoint', 'coolingSetpoint');
  d.acMode = v('airConditionerMode', 'airConditionerMode');
  d.acModes = v('airConditionerMode', 'supportedAcModes') || (d.type === 'ac' ? ['cool','dry','wind','auto','heat'] : null);
  d.fan = v('airConditionerFanMode', 'fanMode');
  d.fanModes = v('airConditionerFanMode', 'supportedAcFanModes') || (d.caps.has('airConditionerFanMode') ? ['auto','low','medium','high','turbo'] : null);
  d.volume = v('audioVolume', 'volume');
  d.muted = v('audioMute', 'mute') === 'muted';
  d.input = v('mediaInputSource', 'inputSource') || v('samsungvd.mediaInputSource', 'inputSource');
  const inp = v('mediaInputSource', 'supportedInputSources') || v('samsungvd.mediaInputSource', 'supportedInputSourcesMap');
  d.inputs = Array.isArray(inp) ? inp.map(x => typeof x === 'string' ? x : (x.id || x.name)) : null;

}
async function refreshDevice(d) {
  try {
    const [st, h] = await Promise.all([api(`/devices/${d.id}/status`), api(`/devices/${d.id}/health`).catch(() => ({}))]);
    applyStatus(d, st);
    d.online = h.state ? h.state !== 'OFFLINE' : true;
  } catch (e) { d.online = false; }
}
async function loadST() {
  S.loading = true; S.error = ''; render();
  try {
    S.locations = (await apiAll('/locations')).map(l => ({ id: l.locationId, name: l.name }));
    if (!S.locations.length) throw new Error('Nenhuma casa encontrada nessa conta.');
    if (!S.locations.find(l => l.id === S.locationId)) S.locationId = S.locations[0].id;
    store.set('locationId', S.locationId);
    S.homeName = S.locations.find(l => l.id === S.locationId).name;
    const [rooms, devs, scenes] = await Promise.all([
      apiAll(`/locations/${S.locationId}/rooms`),
      apiAll(`/devices?locationId=${S.locationId}`),
      apiAll(`/scenes?locationId=${S.locationId}`).catch(() => []),
    ]);
    S.rooms = rooms.map(r => ({ id: r.roomId, name: r.name }));
    S.devices = devs.map(baseDevice);
    S.scenes = scenes.map(s => ({ id: s.sceneId, name: s.sceneName, desc: '' }));
    S.loading = false; render();
    // status em lotes de 6 para não estourar o limite da API
    for (let i = 0; i < S.devices.length; i += 6) {
      await Promise.all(S.devices.slice(i, i + 6).map(refreshDevice));
      render();
    }
  } catch (e) {
    S.loading = false; S.error = e.message === 'Failed to fetch' ? 'Sem conexão com o SmartThings. Verifique a internet.' : e.message; render();
  }
}
async function refreshAll() {
  if (S.mode !== 'st' || !S.devices.length || document.hidden || S.loading) return;
  for (let i = 0; i < S.devices.length; i += 6) await Promise.all(S.devices.slice(i, i + 6).map(refreshDevice));
  render();
}

/* ---------- Modo demonstração ---------- */
function loadDemo() {
  let saved = store.get('demo', null);
  if (!saved || saved.v !== 2) saved = DEMO();
  S.rooms = saved.rooms; S.devices = saved.devices; S.scenes = saved.scenes; S.homeName = saved.homeName;
  S.locations = [{ id: 'demo', name: S.homeName }];
  S.error = ''; render();
}
function saveDemo() { if (S.mode === 'demo') store.set('demo', { v: 2, homeName: S.homeName, rooms: S.rooms, devices: S.devices, scenes: S.scenes }); }

/* ---------- Comandos ---------- */
async function send(d, capability, command, args = []) {
  saveDemo(); render(); renderSheet();
  if (S.mode !== 'st') return;
  try {
    await api(`/devices/${d.id}/commands`, { method: 'POST', body: JSON.stringify({ commands: [{ component: 'main', capability, command, arguments: args }] }) });
  } catch (e) { toast(e.message); }
  clearTimeout(d._t);
  d._t = setTimeout(async () => { await refreshDevice(d); render(); renderSheet(); }, 2500);
}
function setPower(d, on) {
  if (!d.online) return toast(`${d.name} está offline`);
  haptic(); d.on = on; send(d, 'switch', on ? 'on' : 'off');
}
function setTarget(d, t) {
  t = Math.max(16, Math.min(30, Math.round(t))); if (t === d.target) return; haptic(); d.target = t;
  clearTimeout(d._st); render(); renderSheet();
  d._st = setTimeout(() => send(d, 'thermostatCoolingSetpoint', 'setCoolingSetpoint', [t]), 600);
}
function setAcMode(d, m) { haptic(); d.acMode = m; send(d, 'airConditionerMode', 'setAirConditionerMode', [m]); }
function setFan(d, m) { haptic(); d.fan = m; send(d, 'airConditionerFanMode', 'setFanMode', [m]); }
function volume(d, delta) {
  d.volume = Math.max(0, Math.min(100, (d.volume || 0) + delta)); d.muted = false;
  send(d, 'audioVolume', delta > 0 ? 'volumeUp' : 'volumeDown');
}
function mute(d) { d.muted = !d.muted; send(d, 'audioMute', d.muted ? 'mute' : 'unmute'); }
function channel(d, up) { send(d, 'tvChannel', up ? 'channelUp' : 'channelDown'); toast(up ? 'Canal +' : 'Canal −'); }
function setInput(d, src) { d.input = src; send(d, d.inputCap || 'mediaInputSource', 'setInputSource', [src]); }
function setLevel(d, l) { haptic(); d.level = l; d.on = l > 0; send(d, 'switchLevel', 'setLevel', [l]); }
function setCT(d, k) { haptic(); d.ct = k; d.color = null; d.on = true; send(d, 'colorTemperature', 'setColorTemperature', [k]); }
function setColor(d, hue, sat) { haptic(); d.hue = hue; d.sat = sat; d.color = `hsl(${Math.round(hue * 3.6)},${sat}%,62%)`; d.on = true; send(d, 'colorControl', 'setColor', [{ hue, saturation: sat }]); }
const LIGHT_COLORS = [[0, 90], [8, 95], [15, 95], [30, 80], [47, 80], [62, 85], [72, 85], [83, 80], [92, 75]];
const LIGHT_CTS = [[2700, 'Quente', '#ffc46b'], [4000, 'Neutra', '#fff1d6'], [6500, 'Fria', '#d9ecff']];

function downscale(file, max) {

      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.82);

function scanPrompt(name, q) {

Coordenadas: vista de cima, em metros. A origem (0, 0) é o canto superior esquerdo da planta. A parede que aparece de frente na primeira foto é a parede de cima (y = 0); x cresce para a direita e y cresce em direção a quem tirou a primeira foto.

Para cada móvel ou objeto grande que aparece: x e y são o centro da peça; width é a medida ao longo de x e depth ao longo de y, antes de girar; height é a altura; rotation é o giro em graus no sentido horário visto de cima, sendo 0 quando a frente da peça aponta para y crescente (para baixo na planta). Portas, janelas e espelhos ficam junto da parede onde estão. Se várias fotos mostram o mesmo objeto, conte uma vez só.

function aiCall(body) {

    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2026-10-21',
      'anthropic-beta': 'server-side-fallback-2026-07-01', 'anthropic-dangerous-direct-browser-access': 'true' },

}

  if (!SCAN.photos.length) return;

  const room = mapRooms().find(r => r.id === SCAN.room), L = getLayout(), q = L.rooms[SCAN.room];
  const body = {
    model: 'claude-opus-5-5', max_tokens: 16000, fallbacks: 'default',
    output_config: { effort: 'high', format: { type: 'json_schema', schema: AI_SCHEMA } },

    if (status === 0) throw new Error('Sem conexão com a internet.');

function applyScan(rid, res) {

  const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : d);
  if (SCAN.resize) { q.w = snap(Math.max(1.5, Math.min(15, num(res.room_width_m, q.w)))); q.h = snap(Math.max(1.5, Math.min(15, num(res.room_depth_m, q.h)))); }
  const sx = SCAN.resize ? 1 : q.w / Math.max(1, num(res.room_width_m, q.w)), sy = SCAN.resize ? 1 : q.h / Math.max(1, num(res.room_depth_m, q.h));
  q.floor = ['wood', 'tile', 'carpet', 'concrete'].includes(res.floor) ? res.floor : undefined;
  q.floorColor = hex(res.floor_color) || undefined; q.wall = hex(res.wall_color) || undefined;
  L.furniture[rid] = res.furniture.filter(f => AI_FURN_TYPES.includes(f.type)).slice(0, 60).map(f => {
    const d = furnDefaults(f.type);
    return { type: f.type, label: String(f.label || FURN_NAMES[f.type]).slice(0, 40),
      x: Math.max(0, Math.min(q.w, num(f.x, q.w / 2) * sx)), y: Math.max(0, Math.min(q.h, num(f.y, q.h / 2) * sy)),
      width: Math.max(0.1, Math.min(6, num(f.width, d.width))), depth: Math.max(0.02, Math.min(6, num(f.depth, d.depth))),
      height: Math.max(0.01, Math.min(3, num(f.height, d.height))), rotation: [0, 90, 180, 270].includes(f.rotation) ? f.rotation : 0,
      color: hex(f.color) || d.color };
  });
  // posiciona os aparelhos do cômodo onde a IA os viu
  const used = new Set();
  (res.devices_seen || []).forEach(sd => {
    const dev = S.devices.find(d => devRoom(d) === rid && d.type === sd.kind && !used.has(d.id));
    if (!dev) return; used.add(dev.id);
    L.devices[dev.id] = { x: q.x + Math.max(0.2, Math.min(q.w - 0.2, num(sd.x, 1) * sx)), y: q.y + Math.max(0.2, Math.min(q.h - 0.2, num(sd.y, 1) * sy)) };

  S.devices.filter(d => devRoom(d) === rid).forEach(d => { const p = L.devices[d.id]; if (!p) return;
    p.x = Math.max(q.x + 0.2, Math.min(q.x + q.w - 0.2, p.x)); p.y = Math.max(q.y + 0.2, Math.min(q.y + q.h - 0.2, p.y)); });
  store.set(layoutKey(), L);
}

      <div class="dial-btns ${on ? '' : 'disabled'}"><button class="round" data-c="t-">−</button><button class="round" data-c="t+">+</button></div>
      ${d.acModes ? `<div class="label">Modo</div><div class="modes ${on ? '' : 'disabled'}">${d.acModes.map(m => `<button class="mode ${d.acMode === m ? 'on' : ''} ${heat ? 'heat' : ''}" data-c="mode" data-v="${esc(m)}">${MODE_ICONS[m] || MODE_ICONS.auto}${esc(AC_MODES[m] || m)}</button>`).join('')}</div>` : ''}
      ${d.fanModes ? `<div class="label">Ventilação</div><div class="seg ${on ? '' : 'disabled'}">${d.fanModes.map(m => `<button class="${d.fan === m ? 'on' : ''}" data-c="fan" data-v="${esc(m)}">${esc(FAN_MODES[m] || m)}</button>`).join('')}</div>` : ''}`;
  } else if (d.type === 'tv' || d.type === 'speaker') {
    body = `<div class="remote ${on ? '' : 'disabled'}" style="margin-top:18px">
        <div class="col"><button class="round" data-c="v+">+</button><span>VOL ${d.volume ?? ''}</span><button class="round" data-c="v-">−</button></div>
        <div class="col" style="justify-content:center"><button class="round" data-c="mute">${SPK(d.muted)}</button><span>${d.muted ? 'Mudo' : 'Som'}</span></div>
        ${d.type === 'tv' ? `<div class="col"><button class="round" data-c="c+">+</button><span>CANAL</span><button class="round" data-c="c-">−</button></div>` : '<div></div>'}
      </div>
      ${d.inputs && d.inputs.length ? `<div class="label">Fonte</div><div class="chips ${on ? '' : 'disabled'}">${d.inputs.map(s => `<button class="chip ${d.input === s ? 'on' : ''}" data-c="input" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
      ${S.mode === 'st' && d.type === 'tv' && !on ? '<p style="color:var(--dim);font-size:14px;margin-top:16px">Algumas TVs só ligam pela rede se a opção "Ligar com celular" estiver ativa nas configurações da TV.</p>' : ''}`;
  } else if (d.type === 'light') {
    const col = lightColor(d), lv = d.level ?? 100;
    const near = d.color && d.hue != null ? LIGHT_COLORS.reduce((b, c, i) => Math.abs(c[0] - d.hue) < Math.abs(LIGHT_COLORS[b][0] - d.hue) ? i : b, 0) : -1;
    body = `<div class="bulb-hero"><div class="b" style="background:${on ? `radial-gradient(circle, ${col} 0%, transparent 68%)` : '#202027'}">${ICONS.light(on, col).replace('width="38" height="42"', 'width="56" height="62"')}</div></div>
      ${hasCap(d, 'switchLevel') ? `<div class="label">Brilho · <span id="lvl">${on ? lv : 0}%</span></div>
        <input type="range" class="slider" min="1" max="100" value="${on ? lv : 1}" data-lvl="1" style="--p:${on ? lv : 0}%;--lc:${col}">` : ''}
      ${hasCap(d, 'colorTemperature') ? `<div class="label">Tom de branco</div><div class="seg">${LIGHT_CTS.map(([k, n]) => `<button class="${on && !d.color && d.ct && Math.abs(d.ct - k) < 700 ? 'on' : ''}" data-c="ct" data-v="${k}">${n}</button>`).join('')}</div>` : ''}
      ${hasCap(d, 'colorControl') ? `<div class="label">Cor</div><div class="swatches">${LIGHT_COLORS.map(([h, sa], i) => `<button class="sw ${on && i === near ? 'on' : ''}" style="background:hsl(${Math.round(h * 3.6)},${sa}%,60%)" data-c="color" data-v="${h},${sa}"></button>`).join('')}</div>` : ''}`;
  }
  const canPower = d.hasSwitch !== false || S.mode === 'demo';
  openSheet(`<div class="row">
      <div style="flex:1"><h2>${esc(d.name)}</h2><div class="sub" style="margin:2px 0 0">${esc(roomName(d.roomId))} · ${esc(stateText(d))}</div></div>
      ${canPower ? `<button class="power ${on ? 'on' : ''} ${d.type === 'ac' && d.acMode === 'heat' ? 'heat' : ''} ${d.online ? '' : 'disabled'}" data-c="power" aria-label="Ligar/desligar">${POWER}</button>` : ''}
    </div>
    ${d.online ? body : '<div class="panel"><h3>Aparelho offline</h3><p>Verifique se ele está na tomada e conectado ao Wi-Fi.</p></div>'}
    ${S.mode === 'demo' ? `<button class="btn danger" data-c="remove" style="margin-top:22px">Remover aparelho</button>` : ''}`);
}
const MODE_ICONS = {
  cool: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2v20M3.3 7l17.4 10M3.3 17 20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg>',
  dry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>',
  wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h8"/></svg>',
  auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 16 12 7l3.5 9M9.7 13h4.6"/></svg>',
  heat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
};
MODE_ICONS.fanOnly = MODE_ICONS.wind; MODE_ICONS.aIComfort = MODE_ICONS.auto;
const DIAL = { min: 16, max: 30, c: 135, r: 110, start: 135, sweep: 270 };
function dialPt(a) { const r = a * Math.PI / 180; return [DIAL.c + DIAL.r * Math.cos(r), DIAL.c + DIAL.r * Math.sin(r)]; }
function dialArc(a0, a1) { const [x0, y0] = dialPt(a0), [x1, y1] = dialPt(a1); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${DIAL.r} ${DIAL.r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; }
function dialSVG(d) {
  const t = Math.max(DIAL.min, Math.min(DIAL.max, Number(d.target ?? 22)));
  const f = (t - DIAL.min) / (DIAL.max - DIAL.min), end = DIAL.start + DIAL.sweep * f;
  const [kx, ky] = dialPt(end), heat = d.acMode === 'heat';
  const c1 = heat ? '#ffc06b' : '#6fd6ff', c2 = heat ? '#ff5e62' : '#8a7bff';
  let ticks = '';
  for (let i = 0; i <= 14; i++) { const a = (DIAL.start + DIAL.sweep * i / 14) * Math.PI / 180, r1 = 86, r2 = i % 7 === 0 ? 76 : 80;
    ticks += `<line x1="${(135 + r1 * Math.cos(a)).toFixed(1)}" y1="${(135 + r1 * Math.sin(a)).toFixed(1)}" x2="${(135 + r2 * Math.cos(a)).toFixed(1)}" y2="${(135 + r2 * Math.sin(a)).toFixed(1)}" stroke="rgba(255,255,255,${i / 14 <= f ? .5 : .15})" stroke-width="2" stroke-linecap="round"/>`; }
  return `<svg viewBox="0 0 270 270"><defs><linearGradient id="dg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
      <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter></defs>
    <path d="${dialArc(DIAL.start, DIAL.start + DIAL.sweep)}" stroke="rgba(255,255,255,.07)" stroke-width="16" fill="none" stroke-linecap="round"/>
    ${f > 0.002 ? `<path d="${dialArc(DIAL.start, end)}" stroke="url(#dg)" stroke-width="16" fill="none" stroke-linecap="round" filter="url(#glow)" opacity=".55"/>
    <path d="${dialArc(DIAL.start, end)}" stroke="url(#dg)" stroke-width="16" fill="none" stroke-linecap="round"/>` : ''}
    ${ticks}
    <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="14" fill="#fff" stroke="${c2}" stroke-width="4"/>
  </svg>
  <div class="dial-c"><div class="v">${fmtT(t)}<sup>°C</sup></div><div class="l">Ambiente ${fmtT(d.temp)}°C</div>
    <div class="m">${(MODE_ICONS[d.acMode] || '').replace('<svg ', '<svg width="15" height="15" ')}${esc(AC_MODES[d.acMode] || d.acMode || '')}</div></div>`;
}
let dialDrag = false;
function dialMove(e) {
  const w = $('#dialWrap'); const d = S.devices.find(x => x.id === S.sheetDev); if (!w || !d) return;
  const b = w.getBoundingClientRect(), sx = b.width / 270;
  let a = Math.atan2(e.clientY - b.top - 135 * sx, e.clientX - b.left - 135 * sx) * 180 / Math.PI;
  let rel = (a - DIAL.start + 720) % 360;
  if (rel > DIAL.sweep) rel = rel > DIAL.sweep + (360 - DIAL.sweep) / 2 ? 0 : DIAL.sweep;
  setTarget(d, DIAL.min + rel / DIAL.sweep * (DIAL.max - DIAL.min));
}
document.addEventListener('pointerdown', e => { if (e.target.closest('#dialWrap')) { dialDrag = true; dialMove(e); } });
document.addEventListener('pointermove', e => { if (dialDrag) { e.preventDefault(); dialMove(e); } }, { passive: false });
document.addEventListener('pointerup', () => { dialDrag = false; });
document.addEventListener('pointercancel', () => { dialDrag = false; });

function sheetCommand(c, v) {
  const d = S.devices.find(x => x.id === S.sheetDev); if (!d) return;
  switch (c) {
    case 'power': setPower(d, !d.on); break;
    case 't+': setTarget(d, Number(d.target ?? 22) + 1); break;
    case 't-': setTarget(d, Number(d.target ?? 22) - 1); break;
    case 'mode': setAcMode(d, v); break;
    case 'fan': setFan(d, v); break;
    case 'v+': volume(d, 1); break;
    case 'v-': volume(d, -1); break;
    case 'mute': mute(d); break;
    case 'c+': channel(d, true); break;
    case 'c-': channel(d, false); break;
    case 'input': setInput(d, v); break;
    case 'level': setLevel(d, Number(v)); break;
    case 'ct': setCT(d, Number(v)); break;
    case 'color': { const [h, sa] = v.split(',').map(Number); setColor(d, h, sa); break; }
    case 'remove':
      if (confirm(`Remover ${d.name}?`)) { S.devices = S.devices.filter(x => x !== d); saveDemo(); closeSheet(); render(); }
      break;
  }
}

/* ---------- Adicionar / trocar casa ---------- */
function openAdd() {
  if (S.mode === 'st') {
    openSheet(`<h2>Adicionar aparelho</h2><p class="sub">Aparelhos novos são pareados pelo app do fabricante (SmartThings). Depois disso eles aparecem aqui sozinhos.</p>
      <button class="btn" data-act="refresh">Atualizar lista agora</button>`);
    return;
  }
  openSheet(`<h2>Adicionar aparelho</h2><p class="sub">Modo demonstração</p>
    <label class="field"><span>Nome</span><input id="nName" placeholder="Ex.: LUZ VARANDA"></label>
    <label class="field"><span>Tipo</span><select id="nType">${Object.entries(TYPE_NAMES).map(([k, n]) => `<option value="${k}">${n}</option>`).join('')}</select></label>
    <label class="field"><span>Cômodo</span><select id="nRoom">${S.rooms.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}<option value="_new">+ Novo cômodo…</option></select></label>
    <label class="field" id="nRoomNewW" style="display:none"><span>Nome do novo cômodo</span><input id="nRoomNew" placeholder="Ex.: Varanda"></label>
    <button class="btn" data-act="adddev">Adicionar</button>`);
  $('#nRoom').onchange = e => { $('#nRoomNewW').style.display = e.target.value === '_new' ? 'block' : 'none'; };
}
function addDevice() {
  const name = $('#nName').value.trim(); if (!name) return toast('Digite um nome');
  const type = $('#nType').value; let roomId = $('#nRoom').value;
  if (roomId === '_new') {
    const rn = $('#nRoomNew').value.trim(); if (!rn) return toast('Digite o nome do cômodo');
    roomId = 'r' + Date.now(); S.rooms.push({ id: roomId, name: rn });
  }
  const d = { id: 'd' + Date.now(), name, roomId, type, online: true, on: false, hasSwitch: true };
  if (type === 'ac') Object.assign(d, { temp: 26, target: 22, acMode: 'cool', fan: 'auto', acModes: ['cool','dry','wind','auto','heat'], fanModes: ['auto','low','medium','high','turbo'] });
  if (type === 'tv' || type === 'speaker') Object.assign(d, { volume: 10, muted: false, inputs: type === 'tv' ? ['TV','HDMI1','HDMI2'] : null, input: 'TV' });
  if (type === 'light') Object.assign(d, { level: 100, ct: 2700, demoCaps: ['switchLevel', 'colorTemperature', 'colorControl'] });
  S.devices.push(d); saveDemo(); closeSheet(); render(); toast(`${name} adicionado`);
}
function openHomes() {
  if (S.mode !== 'st' || S.locations.length < 2) {
    openSheet(`<h2>Casas</h2><div class="panel"><div class="list-item"><div class="t">${esc(S.homeName)}<small>${S.mode === 'st' ? 'Única casa da conta' : 'Demonstração'}</small></div></div></div>`);
    return;
  }
  openSheet(`<h2>Escolher casa</h2><div class="panel">${S.locations.map(l => `<div class="list-item"><div class="t">${esc(l.name)}</div><button class="chip ${l.id === S.locationId ? 'on' : ''}" data-loc="${esc(l.id)}">${l.id === S.locationId ? 'Atual' : 'Abrir'}</button></div>`).join('')}</div>`);
}

/* ---------- Eventos ---------- */
function animateMain() { const m = $('#main'); m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter'); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('enter'), 500); }
window.onBack = () => {
  if ($('#sheet').classList.contains('show')) { closeSheet(); return true; }
  if ($('#menu').classList.contains('show')) { $('#menu').classList.remove('show'); return true; }
  if (S.page === 'map' && MAP.sel) { MAP.sel = null; render(); return true; }
  if (S.page === 'map' && MAP.edit) { MAP.edit = false; render(); return true; }
  if (S.searchOpen || S.query) { S.searchOpen = false; S.query = ''; render(); return true; }
  if (S.page !== 'devices') { S.page = 'devices'; render(); animateMain(); return true; }
  return false;
};
window.onAppResume = () => refreshAll();
let pressT, longPressed = false;
document.addEventListener('click', e => {
  const t = e.target;
  const link = t.closest('a[href^="https://"]');
  if (link && NATIVE) { e.preventDefault(); NATIVE.openUrl(link.href); return; }
  if (!t.closest('#menu') && !t.closest('#moreBtn')) $('#menu').classList.remove('show');
  const af = t.closest('[data-addf]');
  if (af) { addFurniture(af.dataset.addf); return; }
  const srm = t.closest('[data-scanrm]');
  if (srm) { SCAN.photos.splice(Number(srm.dataset.scanrm), 1); SCAN.result = null; renderScan(); return; }
  const fsel = t.closest('[data-furn]');
  if (fsel && MAP.edit) { if (!MAP.moved) { const i = Number(fsel.dataset.fi); MAP.sel = MAP.sel && MAP.sel.room === fsel.dataset.furn && MAP.sel.i === i ? null : { room: fsel.dataset.furn, i }; render(); } else render(); return; }
  const mapBtn = t.closest('[data-map]');
  if (mapBtn) { mapAction(mapBtn.dataset.map); return; }
  const pin = t.closest('[data-pin]');
  if (pin) { if (!MAP.edit && !MAP.moved) { S.sheetDev = pin.dataset.pin; renderSheet(); } return; }
  const tog = t.closest('[data-toggle]');
  if (tog && !t.closest('.sheet')) { e.stopPropagation(); const d = S.devices.find(x => x.id === tog.dataset.toggle); if (d) { if (d.type === 'other' && !d.hasSwitch && S.mode === 'st') { S.sheetDev = d.id; renderSheet(); } else setPower(d, !d.on); } return; }
  const dev = t.closest('[data-dev]');
  if (dev) { S.sheetDev = dev.dataset.dev; renderSheet(); return; }
  const sec = t.closest('[data-sec]');
  if (sec) { const k = sec.dataset.sec; S.collapsed[k] = !S.collapsed[k]; store.set('collapsed', S.collapsed); render(); return; }
  const tab = t.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; render(); animateMain(); tab.scrollIntoView({ inline: 'center', behavior: 'smooth', block: 'nearest' }); return; }
  if (t.closest('#searchBtn')) { S.searchOpen = !S.searchOpen; if (!S.searchOpen) S.query = ''; render(); if (S.searchOpen) $('#q').focus(); return; }
  const nav = t.closest('[data-page]');
  if (nav) { if (S.page !== nav.dataset.page) { haptic(); S.page = nav.dataset.page; render(); animateMain(); window.scrollTo(0, 0); } return; }
  const sc = t.closest('[data-scene]');
  if (sc) { const s = S.scenes.find(x => x.id === sc.dataset.scene); if (s) runScene(s); return; }
  const c = t.closest('[data-c]');
  if (c) { sheetCommand(c.dataset.c, c.dataset.v); return; }
  const loc = t.closest('[data-loc]');
  if (loc) { S.locationId = loc.dataset.loc; store.set('locationId', S.locationId); S.tab = 'all'; closeSheet(); loadST(); return; }
  const a = t.closest('[data-act]');
  if (a) {
    $('#menu').classList.remove('show');
    switch (a.dataset.act) {
      case 'refresh': closeSheet(); S.mode === 'st' ? loadST() : (loadDemo(), toast('Atualizado')); break;
      case 'alloff': allOff(); break;
      case 'settings': S.page = 'menu'; render(); break;
      case 'adddev': addDevice(); break;
      case 'scango': runScan(); break;
      case 'scanview': closeSheet(); S.page = 'map'; MAP.mode = '3d'; MAP.edit = false; MAP.sel = null; render(); setTimeout(() => window.Casa3D && Casa3D.focusRoom && Casa3D.focusRoom(SCAN.room), 120); SCAN.photos = []; SCAN.result = null; break;
      case 'saveai': { const k = $('#aikeyM').value.trim(); store.set('aikey', k); toast(k ? 'Chave salva' : 'Chave removida'); render(); break; }
      case 'connect': {
        const tok = $('#tok').value.trim(); if (!tok) return toast('Cole o token primeiro');
        S.token = tok; S.mode = 'st'; store.set('token', tok); store.set('mode', 'st');
        S.page = 'devices'; S.tab = 'all'; S.devices = []; document.activeElement.blur(); loadST(); break;
      }
      case 'demo': S.mode = 'demo'; store.set('mode', 'demo'); S.tab = 'all'; loadDemo(); break;
      case 'resetdemo': store.set('demo', null); loadDemo(); toast('Exemplo restaurado'); break;
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.query = e.target.value; render(); return; }
  if (e.target.dataset.lvl) { const v = Number(e.target.value); e.target.style.setProperty('--p', v + '%'); const l = $('#lvl'); if (l) l.textContent = v + '%'; }
});
document.addEventListener('change', e => {
  if (e.target.id === 'scanFile') { addScanFiles(e.target.files); return; }
  if (e.target.id === 'scanRoom') { SCAN.room = e.target.value; return; }
  if (e.target.id === 'scanResize') { SCAN.resize = e.target.checked; return; }
  if (e.target.dataset.lvl) { const d = S.devices.find(x => x.id === S.sheetDev); if (d) setLevel(d, Number(e.target.value)); }
});
$('#scrim').onclick = closeSheet;
$('#addBtn').onclick = openAdd;
$('#homeBtn').onclick = openHomes;
$('#moreBtn').onclick = () => $('#menu').classList.toggle('show');
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
// Arrastar o painel para baixo fecha
let sy = null;
$('#sheet').addEventListener('touchstart', e => { sy = $('#sheet').scrollTop <= 0 && !e.target.closest('#dialWrap') ? e.touches[0].clientY : null; }, { passive: true });
$('#sheet').addEventListener('touchend', e => { if (sy != null && e.changedTouches[0].clientY - sy > 90) closeSheet(); sy = null; });

setInterval(refreshAll, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshAll(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

if (S.mode === 'st' && S.token) loadST(); else { S.mode = 'demo'; loadDemo(); }
</script>
</body>
